<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マヨゲイズシステム</title>
    <style>
        /* CSSの全体設定 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ffc107;
            text-align: center;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 10px;
            margin-bottom: 20px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            font-size: 26px; 
        }
        /* 予約状況の表示エリア */
        #status-display {
            padding: 15px;
            margin-top: 20px;
            margin-bottom: 10px; /* 新規予約との間に少しスペースを空ける */
            border-radius: 6px;
            text-align: center;
            font-size: 1.1em; 
            font-weight: bold;
            min-height: 20px; /* 内容がなくても高さを確保 */
        }
        .status-free {
            background-color: #d4edda;
            color: #155724;
        }
        .status-reserved {
            background-color: #ffeeba;
            color: #856404;
        }
        /* その他の入力フォームとボタンのスタイル */
        h2 { margin-top: 20px; }
        .input-group { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        .input-group label { 
            min-width: 80px; 
            font-weight: bold; 
        }
        /* テキスト、ドロップダウン、datetime-localのスタイルを調整 */
        .input-group input[type="text"],
        .input-group input[type="datetime-local"],
        .input-group select { 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            flex-grow: 1; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.3s; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
        #reservation-list { 
            list-style: none; 
            padding: 0; 
            margin-top: 20px; 
        }
        /* 予約リストの表示を改善 */
        #reservation-list li { 
            background-color: #e9ecef; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-left: 5px solid #ffc107; 
            border-radius: 4px; 
            font-size: 1em; 
        }
        #reservation-list li strong {
            color: #007bff;
        }
    </style>
</head>
<body onload="initSystem()">

    <div class="container">
        <h1>マヨゲイズシステム</h1>

        <div class="input-group">
            <label for="target-name">予約対象:</label>
            <select id="target-name" name="target-name" required onchange="checkReservationStatus(this.value)">
                <option value="" disabled selected>-- 予約する人を選択 --</option>
                <option value="しき">しき</option>
                <option value="さくら">さくら</option>
                <option value="あちゃ">あちゃ</option>
                <option value="マヨネーズ">マヨネーズ</option>
                <option value="じゃがりこ">じゃがりこ</option>
                <option value="とも">とも</option>
                <option value="ラスカル">ラスカル</option>
                <option value="ぽむ">ぽむ</option>
                <option value="まお">まお</option>
                <option value="アピ丸">アピ丸</option>
                <option value="ここね">ここね</option>
            </select>
        </div>

        <div id="status-display" class="status-free">
            ⬆️ 予約対象を選択してください
        </div>

        <hr>

        <h2>新規予約</h2>
        
        <div class="input-group">
            <label for="reserver-name">予約者:</label>
            <input type="text" id="reserver-name" name="reserver-name" required placeholder="あなたの名前を入力">
        </div>

        <div class="input-group">
            <label for="start-time">開始日時:</label>
            <input type="datetime-local" id="start-time" name="start-time" required>
        </div>
        <div class="input-group">
            <label for="end-time">終了日時:</label>
            <input type="datetime-local" id="end-time" name="end-time" required>
        </div>

        <button onclick="addReservation()">予約</button>

        <hr>

        <h2>すべての予約状況</h2>
        <ul id="reservation-list">
            </ul>
        <button onclick="clearAllReservations()" style="background-color: #dc3545; margin-top: 10px;">すべての予約を消去する (スプレッドシートを直接編集してください)</button>

    </div>

    <script>
        // !! ここに、デプロイしたGASのURLを貼り付けてください !!
        const GAS_URL = "【あなたのGAS URLをここに貼り付けてください】"; 
        
        // 予約データを複数保存するためのキー
        const RESERVATION_KEY = 'mayo_all_reservations';
        
        /**
         * ユーティリティ: ローカルストレージから全予約データを取得
         */
        function getReservations() {
            const stored = localStorage.getItem(RESERVATION_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        /**
         * ユーティリティ: 予約データをローカルストレージに保存
         */
        function saveReservations(reservations) {
            localStorage.setItem(RESERVATION_KEY, JSON.stringify(reservations));
        }

        /**
         * 予約時間が重複しているかチェック
         */
        function isTimeSlotReserved(newTargetName, newStart, newEnd) {
            const reservations = getReservations();
            
            if (newStart >= newEnd) {
                return true; 
            }

            return reservations.some(res => {
                const existingStart = new Date(res.start);
                const existingEnd = new Date(res.end);
                
                if (res.name === newTargetName) {
                    if (existingStart < newEnd && newStart < existingEnd) {
                        return true;
                    }
                }
                return false;
            });
        }

        /**
         * 予約情報をGASに送信し、ブラウザのストレージに保存する（重複チェック付き）
         */
        function addReservation() {
            // 統合された一つのドロップダウン (target-name) から値を取得
            const targetName = document.getElementById('target-name').value; 
            const reserverName = document.getElementById('reserver-name').value;
            const startTimeStr = document.getElementById('start-time').value; 
            const endTimeStr = document.getElementById('end-time').value;

            if (targetName === "" || reserverName === "" || startTimeStr === "" || endTimeStr === "") {
                alert("すべての項目を選択・入力してください！");
                return;
            }
            
            const startTime = new Date(startTimeStr);
            const endTime = new Date(endTimeStr);

            // 1. 予約の重複チェック
            if (isTimeSlotReserved(targetName, startTime, endTime)) {
                alert("その時間は既に予約されてるっちゃむ");
                return;
            }

            const reservationData = { 
                name: targetName, 
                reserver: reserverName, 
                start: startTimeStr, 
                end: endTimeStr 
            };

            // 2. GASへデータを送信
            fetch(GAS_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', 
                },
                body: JSON.stringify(reservationData), 
            })
            .then(response => {
                 return response.text().then(text => {
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error('GASからの応答形式が不正です。');
                    }
                 });
            })
            .then(result => {
                if (result && result.result === 'success') {
                    // 3. サーバーへの送信が成功したら、ローカルのリストに追加
                    const allReservations = getReservations();
                    allReservations.push(reservationData);
                    saveReservations(allReservations);
                    
                    // 画面を更新
                    displayAllReservations();
                    // 予約状況の表示も更新
                    checkReservationStatus(targetName);

                    alert(`予約対象:${targetName} さんの予約を予約者:${reserverName} さんが送信しました！`);
                    
                } else {
                    alert(`予約送信中にエラーが発生しました: ${result ? result.message : '不明なエラー'}`);
                }
            })
            .catch(error => {
                alert("GASへの通信に失敗しました。URLやネットワークを確認してください。");
                console.error('通信エラー:', error);
            });

            // 4. 入力欄をクリア
            // target-nameはそのまま（選択状態を維持）、他の欄をクリア
            document.getElementById('reserver-name').value = "";
            document.getElementById('start-time').value = "";
            document.getElementById('end-time').value = "";
        }

        /**
         * 期限切れの予約をローカルストレージから削除し、残りの予約をリストに表示する
         */
        function displayAllReservations() {
            const list = document.getElementById('reservation-list');
            list.innerHTML = ''; 

            let allReservations = getReservations();
            const now = new Date();
            
            // 期限切れの予約をフィルタリング (終了時刻 < 現在時刻 の予約を削除)
            const activeReservations = allReservations.filter(res => {
                const endTimeObj = new Date(res.end);
                return endTimeObj > now;
            });

            // 期限切れの予約が削除されたら、ローカルストレージを更新
            if (activeReservations.length !== allReservations.length) {
                saveReservations(activeReservations);
                allReservations = activeReservations;
            }

            if (allReservations.length > 0) {
                // 開始時刻が近い順にソート
                allReservations.sort((a, b) => new Date(a.start) - new Date(b.start));

                allReservations.forEach(reservation => {
                    const listItem = document.createElement('li');
                    
                    // 日付と時刻の表示を整形
                    const startDisplay = reservation.start.replace('T', ' ');
                    const endDisplay = reservation.end.replace('T', ' ');

                    // 誰が誰を予約したかを強調して表示
                    listItem.innerHTML = `
                        <strong>${reservation.reserver}</strong> さんが 
                        <strong>${reservation.name}</strong> さんを予約: 
                        <br>
                        ${startDisplay} から ${endDisplay} まで
                    `;
                    list.appendChild(listItem);
                });
            } else {
                 const listItem = document.createElement('li');
                 listItem.textContent = `予約されてないっちゃむ。`;
                 list.appendChild(listItem);
            }
        }

        /**
         * 全予約をローカルストレージから消去
         */
        function clearAllReservations() {
            localStorage.removeItem(RESERVATION_KEY);
            displayAllReservations();
            checkReservationStatus(document.getElementById('target-name').value);
            alert("ブラウザに記憶されたすべての予約を消去しました。");
        }

        /**
         * 選択された予約対象の現在の予約状況をチェックし、表示する
         */
        function checkReservationStatus(targetName) {
            const statusDisplay = document.getElementById('status-display');
            const allReservations = getReservations();
            const now = new Date();
            
            // 予約対象が選択されていない場合はメッセージのみ
            if (!targetName) {
                statusDisplay.textContent = "⬆️ 予約対象を選択してください";
                statusDisplay.className = 'status-free';
                return;
            }

            // 選択された予約対象の、現在時刻に有効な予約を探す
            const currentReservation = allReservations.find(res => {
                if (res.name !== targetName) return false;
                
                const startTimeObj = new Date(res.start);
                const endTimeObj = new Date(res.end);
                
                return now >= startTimeObj && now < endTimeObj;
            });

            if (currentReservation) {
                // 予約中の表示
                const startDisplay = currentReservation.start.replace('T', ' ');
                const endDisplay = currentReservation.end.replace('T', ' ');
                statusDisplay.textContent = `${targetName} さんは予約者: ${currentReservation.reserver} さんにより予約中です (${startDisplay} - ${endDisplay})`;
                statusDisplay.className = 'status-reserved';
            } else {
                // 次の予約を探す
                const nextReservation = allReservations
                    .filter(res => res.name === targetName && new Date(res.start) > now)
                    .sort((a, b) => new Date(a.start) - new Date(b.start))[0]; 

                if (nextReservation) {
                    const startDisplay = nextReservation.start.replace('T', ' ');
                    statusDisplay.textContent = `${targetName} さんは現在、予約されていません (次の予約は ${startDisplay} から)`;
                } else {
                    statusDisplay.textContent = `${targetName} さんは現在、予約されていません`;
                }
                statusDisplay.className = 'status-free';
            }
        }

        /**
         * システム起動時の初期化処理
         */
        function initSystem() {
            // 期限切れ予約の削除とリスト表示を最初に実行
            displayAllReservations(); 
            // 1分ごとにステータスチェックと期限切れ予約の削除を実行
            setInterval(() => {
                // 期限切れの予約を削除・リストを更新
                displayAllReservations(); 
                // 選択中の予約対象のステータスを更新
                checkReservationStatus(document.getElementById('target-name').value);
            }, 60000); 
        }

    </script>

</body>
</html>
