<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マヨゲイズシステム</title>
    <style>
        /* CSSの全体設定 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ffc107;
            text-align: center;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 10px;
            margin-bottom: 20px;
            /* タイトルが改行されないように設定 */
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            /* ★★★ フォントサイズを小さく修正 ★★★ */
            font-size: 36px; 
        }
        /* 予約状況の表示エリア */
        #status-display {
            padding: 15px;
            margin-top: 20px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1em; 
            font-weight: bold;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            display: block;
        }
        .status-free {
            background-color: #d4edda;
            color: #155724;
        }
        .status-reserved {
            background-color: #ffeeba;
            color: #856404;
        }
        /* その他の入力フォームとボタンのスタイル */
        .input-group { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        .input-group label { 
            min-width: 80px; 
            font-weight: bold; 
        }
        /* テキスト、ドロップダウン、datetime-localのスタイルを調整 */
        .input-group input[type="text"],
        .input-group input[type="datetime-local"],
        .input-group select { 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            flex-grow: 1; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.3s; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
        #reservation-list { 
            list-style: none; 
            padding: 0; 
            margin-top: 20px; 
        }
        #reservation-list li { 
            background-color: #e9ecef; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-left: 5px solid #ffc107; 
            border-radius: 4px; 
            font-size: 1.1em; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
    </style>
</head>
<body onload="checkReservationStatus()">

    <div class="container">
        <h1>マヨゲイズシステム</h1>

        <div id="status-display" class="status-free">
        </div>

        <hr>

        <h2>新規予約</h2>
        
        <div class="input-group">
            <label for="target-name">予約対象:</label>
            <select id="target-name" name="target-name" required>
                <option value="" disabled selected>-- 予約する人を選択 --</option>
                <option value="しき">しき</option>
                <option value="さくら">さくら</option>
                <option value="あちゃ">あちゃ</option>
                <option value="マヨネーズ">マヨネーズ</option>
                <option value="じゃがりこ">じゃがりこ</option>
                <option value="とも">とも</option>
                <option value="ラスカル">ラスカル</option>
                <option value="ぽむ">ぽむ</option>
                <option value="まお">まお</option>
                <option value="アピ丸">アピ丸</option>
                <option value="ここね">ここね</option>
            </select>
        </div>

        <div class="input-group">
            <label for="reserver-name">予約者:</label>
            <input type="text" id="reserver-name" name="reserver-name" required placeholder="あなたの名前を入力">
        </div>

        <div class="input-group">
            <label for="start-time">開始日時:</label>
            <input type="datetime-local" id="start-time" name="start-time" required>
        </div>
        <div class="input-group">
            <label for="end-time">終了日時:</label>
            <input type="datetime-local" id="end-time" name="end-time" required>
        </div>

        <button onclick="addReservation()">予約</button>

        <hr>

        <h2>予約状況</h2>
        <ul id="reservation-list">
            </ul>
        <button onclick="clearReservation()" style="background-color: #dc3545; margin-top: 10px;">予約を消去する (スプレッドシートを直接編集してください)</button>

    </div>

    <script>
        // !! ここに、デプロイしたGASのURLを貼り付けてください !!
        const GAS_URL = "【あなたのGAS URLをここに貼り付けてください】"; 
        
        const RESERVATION_KEY = 'mayo_reservation_times';

        /**
         * 予約情報をGASに送信し、ブラウザのストレージに保存する
         */
        function addReservation() {
            const targetName = document.getElementById('target-name').value;
            const reserverName = document.getElementById('reserver-name').value;
            
            const startTime = document.getElementById('start-time').value; 
            const endTime = document.getElementById('end-time').value;

            if (targetName === "" || reserverName === "" || startTime === "" || endTime === "") {
                alert("すべての項目を選択・入力してください！");
                return;
            }
            
            const reservationData = { 
                name: targetName, // 予約対象
                reserver: reserverName, // 予約者 
                start: startTime, 
                end: endTime 
            };

            // GASへデータを送信
            fetch(GAS_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', 
                },
                body: JSON.stringify(reservationData), 
            })
            .then(response => {
                 return response.text().then(text => {
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error('GASからの応答形式が不正です。');
                    }
                 });
            })
            .then(result => {
                if (result && result.result === 'success') {
                    // サーバーへの送信が成功したら、ローカルにも情報を記憶（表示のため）
                    const localSave = { name: targetName, reserver: reserverName, start: startTime, end: endTime };
                    localStorage.setItem(RESERVATION_KEY, JSON.stringify(localSave));
                    
                    displayStoredReservation();
                    checkReservationStatus();
                    alert(`予約対象:${targetName} さんの予約を予約者:${reserverName} さんが送信しました！`);
                    
                } else {
                    alert(`予約送信中にエラーが発生しました: ${result ? result.message : '不明なエラー'}`);
                }
            })
            .catch(error => {
                alert("GASへの通信に失敗しました。URLやネットワークを確認してください。");
                console.error('通信エラー:', error);
            });

            // 入力欄をクリア
            document.getElementById('target-name').value = "";
            document.getElementById('reserver-name').value = "";
            document.getElementById('start-time').value = "";
            document.getElementById('end-time').value = "";
        }

        /**
         * 記憶された予約をリストに表示する
         */
        function displayStoredReservation() {
            const list = document.getElementById('reservation-list');
            list.innerHTML = ''; 

            const stored = localStorage.getItem(RESERVATION_KEY);
            if (stored) {
                const reservation = JSON.parse(stored);
                const listItem = document.createElement('li');
                
                // 日付と時刻の表示を整形 (Tで区切って表示)
                const startDisplay = reservation.start.replace('T', ' ');
                const endDisplay = reservation.end.replace('T', ' ');

                // 予約者と予約対象を表示
                listItem.textContent = `[予約者: ${reservation.reserver}] ${reservation.name} さん: ${startDisplay} から ${endDisplay} まで`;
                list.appendChild(listItem);
            } else {
                 const listItem = document.createElement('li');
                 listItem.textContent = `記憶された予約はありません。`;
                 list.appendChild(listItem);
            }
        }

        function clearReservation() {
            localStorage.removeItem(RESERVATION_KEY);
            displayStoredReservation();
            checkReservationStatus();
            alert("ブラウザに記憶された予約を消去しました。");
        }

        /**
         * 現在の時刻と予約時間を比較し、ステータスを表示する
         */
        function checkReservationStatus() {
            const statusDisplay = document.getElementById('status-display');
            const stored = localStorage.getItem(RESERVATION_KEY);

            if (!stored) {
                statusDisplay.textContent = "現在、予約されていません";
                statusDisplay.className = 'status-free';
                return;
            }

            const reservation = JSON.parse(stored);
            const now = new Date();
            
            const startTimeObj = new Date(reservation.start);
            const endTimeObj = new Date(reservation.end);
            
            // 表示用の整形
            const startDisplay = reservation.start.replace('T', ' ');
            const endDisplay = reservation.end.replace('T', ' ');

            if (now >= startTimeObj && now < endTimeObj) {
                // 予約中の表示に予約者と予約対象を含める
                statusDisplay.textContent = `${reservation.name} さんの予約中です (予約者: ${reservation.reserver}) (${startDisplay} - ${endDisplay})`;
                statusDisplay.className = 'status-reserved';
            } else {
                // 予約時間外の表示に予約者と予約対象を含める
                statusDisplay.textContent = `現在、予約されていません (次の予約は ${reservation.name} さんの ${startDisplay} から)`;
                statusDisplay.className = 'status-free';
            }
        }

        document.addEventListener('DOMContentLoaded', displayStoredReservation);
        // 1分ごとにステータスをチェック
        setInterval(checkReservationStatus, 60000); 

    </script>

</body>
</html>
