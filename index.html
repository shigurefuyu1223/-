<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マヨネーズ予約システム</title>
    <style>
        /* CSSの全体設定 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ffc107;
            text-align: center;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        /* 予約状況の表示エリア (見切れ対策済み) */
        #status-display {
            padding: 15px;
            margin-top: 20px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1em; 
            font-weight: bold;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            display: block;
        }
        .status-free {
            background-color: #d4edda;
            color: #155724;
        }
        .status-reserved {
            background-color: #ffeeba;
            color: #856404;
        }
        /* その他の入力フォームとボタンのスタイル */
        .input-group { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        .input-group label { 
            min-width: 80px; 
            font-weight: bold; 
        }
        /* datetime-localのスタイルを調整 */
        .input-group input:not([type="datetime-local"]) { 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            flex-grow: 1; 
        }
        .input-group input[type="datetime-local"] { 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            flex-grow: 1; 
            box-sizing: border-box; /* 枠線を含めて幅を計算 */
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background-color 0.3s; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
        #reservation-list { 
            list-style: none; 
            padding: 0; 
            margin-top: 20px; 
        }
        #reservation-list li { 
            background-color: #e9ecef; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-left: 5px solid #ffc107; 
            border-radius: 4px; 
            font-size: 1.1em; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
    </style>
</head>
<body onload="checkReservationStatus()">

    <div class="container">
        <h1>マヨネーズ予約システム</h1>

        <div id="status-display" class="status-free">
        </div>

        <hr>

        <h2>新規予約</h2>
        
        <div class="input-group">
            <label for="name">名　前:</label>
            <input type="text" id="name" name="name" required placeholder="予約者名を入力">
        </div>

        <div class="input-group">
            <label for="start-time">開始日時:</label>
            <input type="datetime-local" id="start-time" name="start-time" required>
        </div>
        <div class="input-group">
            <label for="end-time">終了日時:</label>
            <input type="datetime-local" id="end-time" name="end-time" required>
        </div>

        <button onclick="addReservation()">予約</button>

        <hr>

        <h2>予約状況</h2>
        <ul id="reservation-list">
            </ul>
        <button onclick="clearReservation()" style="background-color: #dc3545; margin-top: 10px;">予約を消去する</button>

    </div>

    <script>
        // 💡 修正点 1: GASのデプロイURLを定義
        const GAS_URL = "【https://script.google.com/macros/s/AKfycbxu4P5IQT9lxaj_CAWb4Nw42YYEuK6bR8TRX-Dg3UttaifT2o2p3pDo0SNQvkVMBzDX/exec】";
        
        const RESERVATION_KEY = 'mayo_reservation_times';

        /**
         * 予約情報をGASに送信し、ブラウザのストレージに保存する
         */
        function addReservation() {
            const name = document.getElementById('name').value;
            // 💡 変更点: valueが「YYYY-MM-DDTHH:MM」形式で取得できるようになった
            const startTime = document.getElementById('start-time').value; 
            const endTime = document.getElementById('end-time').value;

            if (name === "" || startTime === "" || endTime === "") {
                alert("名前、開始日時、終了日時のすべてを入力してください！");
                return;
            }
            
            // サーバー（GAS）へ送信するデータ形式を準備
            const reservationData = { 
                name: name, 
                // 💡 変更点: datetime-localの値はISO形式に近いため、そのまま送信（秒はGAS側で付加）
                start: startTime, 
                end: endTime 
            };

            // GASへデータを送信
            fetch(GAS_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(reservationData), 
            })
            .then(response => response.json())
            .then(result => {
                if (result.result === 'success') {
                    // サーバーへの送信が成功したら、ローカルにも情報を記憶（表示のため）
                    const localSave = { name: name, start: startTime, end: endTime };
                    localStorage.setItem(RESERVATION_KEY, JSON.stringify(localSave));
                    
                    displayStoredReservation();
                    checkReservationStatus();
                    alert(`${name} さんの予約を送信し、ブラウザに記憶しました！`);
                    
                } else {
                    alert(`予約送信中にエラーが発生しました: ${result.message}`);
                }
            })
            .catch(error => {
                alert("GASへの通信に失敗しました。URLやネットワークを確認してください。");
                console.error('通信エラー:', error);
            });

            // 入力欄をクリア
            document.getElementById('name').value = "";
            document.getElementById('start-time').value = "";
            document.getElementById('end-time').value = "";
        }

        /**
         * 記憶された予約をリストに表示する
         */
        function displayStoredReservation() {
            const list = document.getElementById('reservation-list');
            list.innerHTML = ''; 

            const stored = localStorage.getItem(RESERVATION_KEY);
            if (stored) {
                const reservation = JSON.parse(stored);
                const listItem = document.createElement('li');
                
                // 日付と時刻の表示を整形 (Tで区切って表示)
                const startDisplay = reservation.start.replace('T', ' ');
                const endDisplay = reservation.end.replace('T', ' ');

                listItem.textContent = `${reservation.name} さん: ${startDisplay} から ${endDisplay} まで`;
                list.appendChild(listItem);
            } else {
                 const listItem = document.createElement('li');
                 listItem.textContent = `記憶された予約はありません。`;
                 list.appendChild(listItem);
            }
        }

        function clearReservation() {
            localStorage.removeItem(RESERVATION_KEY);
            displayStoredReservation();
            checkReservationStatus();
            alert("記憶された予約を消去しました。");
        }

        /**
         * 現在の時刻と予約時間を比較し、ステータスを表示する
         */
        function checkReservationStatus() {
            const statusDisplay = document.getElementById('status-display');
            const stored = localStorage.getItem(RESERVATION_KEY);

            if (!stored) {
                statusDisplay.textContent = "現在、予約されていません";
                statusDisplay.className = 'status-free';
                return;
            }

            const reservation = JSON.parse(stored);
            const now = new Date();
            
            // 💡 変更点: datetime-localで取得した値はそのまま new Date() に渡せる
            const startTimeObj = new Date(reservation.start);
            const endTimeObj = new Date(reservation.end);
            
            // 表示用の整形
            const startDisplay = reservation.start.replace('T', ' ');
            const endDisplay = reservation.end.replace('T', ' ');

            // 終了時間が開始時間より前でも日付を考慮するため、このチェックは不要

            if (now >= startTimeObj && now < endTimeObj) {
                // 予約中の表示に名前を含める
                statusDisplay.textContent = `${reservation.name} さんの予約中です (${startDisplay} - ${endDisplay})`;
                statusDisplay.className = 'status-reserved';
            } else {
                // 予約時間外の表示に名前を含める
                statusDisplay.textContent = `現在、予約されていません (次の予約は ${reservation.name} さんの ${startDisplay} から)`;
                statusDisplay.className = 'status-free';
            }
        }

        document.addEventListener('DOMContentLoaded', displayStoredReservation);
        // 1分ごとにステータスをチェック
        setInterval(checkReservationStatus, 60000); 

    </script>

</body>
</html>
